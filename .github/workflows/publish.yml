name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Type check
        run: deno task check

      - name: Test
        run: deno task test

      - name: Publish
        run: deno publish
